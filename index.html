<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>도쿄 가이드북</title>
<meta name="description" content="도쿄 여행 가이드북" />

<!-- PWA / 홈 화면 추가 -->
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="도쿄 가이드북" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --sub: #8a8f98;
    --card-border: #e5e7eb;
    --card-border-width: 30px;   /* 테두리 두께 */
    --card-radius: 40px;
    --gap: 14px;
    --pad: 20px;
    --hero-top: 28px;            /* 이미지를 위에서 얼마나 내릴지 */

    --font-ko: "HY견고딕", "HYGothic-Extra", "HYGothic Extra",
               "HY헤드라인M", "HYHeadLine-Medium",
               -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
               "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ko);
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100dvh;
    overscroll-behavior-y: none;
  }

  /* ── 상단 히어로 이미지 ── */
  .hero {
    position: relative;
    padding-top: calc(env(safe-area-inset-top) + var(--hero-top));
    background: var(--bg);
  }

  .hero-media {
    position: relative;
    width: 100%;
    line-height: 0;
  }

  /* 이미지 전체가 잘리지 않고 그대로 보이도록 */
  .hero-media img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* 이미지 아래에서 1/3 지점부터 흰색으로 사라지는 그라데이션 */
  .hero-media::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0) 66%,
      rgba(255, 255, 255, 0.55) 82%,
      rgba(255, 255, 255, 0.88) 93%,
      #ffffff 100%
    );
    pointer-events: none;
  }

  .hero-title {
    position: absolute;
    left: var(--pad);
    bottom: 6px;
    z-index: 1;
    margin: 0;
    line-height: 1.15;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #1a1a1a;
  }

  .hero-title span {
    display: block;
    margin-top: 4px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.4px;
    color: var(--sub);
  }

  /* ── 2x2 지역 선택 ── */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--gap);
    padding: 10px var(--pad) calc(var(--pad) + env(safe-area-inset-bottom));
    max-width: 560px;
    margin: 0 auto;
  }

  .card {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--bg);
    border: var(--card-border-width) solid var(--card-border);
    border-radius: var(--card-radius);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
    user-select: none;
  }

  .card.soon {
    color: #c3c7cd;
    font-weight: 500;
  }

  @media (min-width: 560px) {
    .card { font-size: 20px; }
  }
</style>
</head>
<body>

  <header class="hero">
    <div class="hero-media">
      <img src="images/tokyo.png" alt="도쿄" />
    </div>
    <h1 class="hero-title">도쿄 가이드북<span>TOKYO GUIDE BOOK</span></h1>
  </header>

  <main class="grid">
    <div class="card">시부야</div>
    <div class="card">아키하바라</div>
    <div class="card soon">준비중</div>
    <div class="card soon">준비중</div>
  </main>

</body>
</html>
