<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>도쿄 가이드북</title>
<meta name="description" content="도쿄 여행 가이드북" />

<!-- PWA / 홈 화면 추가 -->
<meta name="theme-color" content="#e8eaee" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="도쿄 가이드북" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<!-- 모바일에서도 쓰이는 웹폰트 (HY견고딕 대체) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;700;900&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <!-- 왼쪽 위 홈 버튼: 어느 페이지에서든 홈 화면으로 -->
  <a class="home-btn" href="./" aria-label="홈으로">
    <svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 10.6 12 3.5l9 7.1" />
      <path d="M5.6 9.6V20h12.8V9.6" />
      <path d="M9.8 20v-5.6h4.4V20" />
    </svg>
  </a>

  <header class="hero">
    <div class="hero-media rise">
      <img src="images/tokyo.png" alt="도쿄" />
    </div>
    <h1 class="hero-title rise" style="--delay: 0.12s">도쿄 가이드북<span>TOKYO GUIDE BOOK</span></h1>
    <!-- 일정표를 볼 때 같은 자리에 대신 들어가는 제목 -->
    <h2 class="hero-title hero-title-alt" hidden>일정표</h2>
  </header>

  <main>
    <!-- 지역 선택 -->
    <section class="grid" id="view-areas" aria-label="지역 선택"></section>

    <!-- 일정표 (메뉴에서 전환) -->
    <section id="view-schedule" class="view-schedule" hidden>
      <!-- 여기에 일정표(표)가 들어감 -->
    </section>
  </main>

  <noscript>
    <p class="noscript">이 앱을 보려면 자바스크립트를 켜 주세요.</p>
  </noscript>

</div>

<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
